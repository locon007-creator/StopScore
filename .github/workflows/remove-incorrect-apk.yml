name: Remove Incorrect StopScore APK Release
on:
  push:
    branches: [main]
    paths: [".github/workflows/remove-incorrect-apk.yml"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove incorrect APK release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete stopscore-android-latest --repo "${{ github.repository }}" --cleanup-tag --yes
