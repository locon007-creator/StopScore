name: Build StopScore APK

on:
  push:
    branches: [main]
    paths:
      - "android-wrapper/**"
      - ".github/workflows/build-android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stopscore-android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-wrapper

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build installable APK
        run: gradle --no-daemon assembleRelease

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk StopScore.apk
          sha256sum StopScore.apk

      - name: Publish direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: stopscore-android-latest
          name: StopScore Android
          prerelease: false
          make_latest: true
          files: android-wrapper/StopScore.apk
          body: |
            Installable Android APK for StopScore Driver OS.
            
            Download StopScore.apk on your Android phone, open it, and allow installation from your browser when Android asks.
